<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>VAULTED · SECURE ACCOUNT LINK</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background: #0B0F14;
      color: #e7eef8;
      font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      user-select: none;
    }
    .chrome {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 54px;
      padding: 0 12px 0 16px;
      border-bottom: 1px solid rgba(148, 163, 184, .14);
      background:
        radial-gradient(120% 180% at 0% 0%, rgba(124, 140, 255, .16), transparent 58%),
        #0B0F14;
      -webkit-app-region: drag;
    }
    .brand { display: flex; min-width: 0; align-items: center; gap: 10px; }
    .mark {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 9px;
      background: linear-gradient(135deg, #7c8cff, #d946ef);
      box-shadow: 0 8px 22px rgba(124, 140, 255, .28);
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: -.04em;
    }
    .copy { min-width: 0; }
    .eyebrow {
      color: #7f90a6;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .title {
      overflow: hidden;
      margin-top: 1px;
      color: #f3f7fd;
      font-size: 12.5px;
      font-weight: 650;
      letter-spacing: -.01em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .actions { display: flex; align-items: center; gap: 10px; -webkit-app-region: no-drag; }
    .secure {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(52, 211, 153, .2);
      border-radius: 999px;
      background: rgba(52, 211, 153, .07);
      padding: 4px 8px;
      color: #8ee7c2;
      font-size: 8.5px;
      font-weight: 800;
      letter-spacing: .12em;
    }
    .dot {
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: #34d399;
      box-shadow: 0 0 8px #34d399;
    }
    .close {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 1px solid transparent;
      border-radius: 9px;
      background: transparent;
      color: #8b9bb0;
      cursor: pointer;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }
    .close:hover { border-color: rgba(251, 113, 133, .22); background: rgba(251, 113, 133, .1); color: #fecdd3; }
    .close:focus-visible { outline: 2px solid rgba(124, 140, 255, .7); outline-offset: 2px; }
    .stage {
      display: flex;
      height: calc(100vh - 54px);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background:
        radial-gradient(60% 45% at 50% 12%, rgba(124, 140, 255, .12), transparent 70%),
        #0B0F14;
    }
    .spinner {
      width: 26px;
      height: 26px;
      border: 2px solid rgba(148, 163, 184, .18);
      border-top-color: #8ea0ff;
      border-radius: 999px;
      animation: spin .85s linear infinite;
    }
    .stage p { margin: 0; color: #7f90a6; font-size: 11px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header class="chrome">
    <div class="brand">
      <span class="mark" aria-hidden="true">V</span>
      <div class="copy">
        <div class="eyebrow">VAULTED · Secure account link</div>
        <div class="title" id="provider-title">VAULTED · SECURE ACCOUNT LINK</div>
      </div>
    </div>
    <div class="actions">
      <span class="secure"><span class="dot"></span>ENCRYPTED</span>
      <button class="close" id="close" type="button" aria-label="Close sign in">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>
  <main class="stage">
    <div class="spinner" aria-hidden="true"></div>
    <p id="stage-copy">Opening the secure sign-in page…</p>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(location.search)
      document.getElementById('provider-title').textContent = 'VAULTED · SECURE ACCOUNT LINK'
      document.getElementById('stage-copy').textContent =
        params.get('mode') === 'verification'
          ? 'Complete verification to continue…'
          : 'Opening the secure sign-in page…'
      document.getElementById('close').addEventListener('click', () => window.vaultedAuth?.close())
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') window.vaultedAuth?.close()
      })
    })()
  </script>
</body>
</html>
